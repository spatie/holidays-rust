[package]
name = "spatie-holidays"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Freek Van der Herten <freek@spatie.be>"]
description = "Calculate public holidays for a country"
license = "MIT"
repository = "https://github.com/spatie/holidays-rust"
documentation = "https://docs.rs/spatie-holidays"
readme = "README.md"
keywords = ["spatie", "holidays", "calendar", "public-holidays"]
categories = ["date-and-time", "localization"]
include = ["/src/", "/tests/", "/tools/", "/build.rs", "/docs/", "/README.md", "/LICENSE.md", "/UNICODE-LICENSE.txt", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/Cargo.lock"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
icu_calendar = { version = "2.1", features = ["compiled_data"] }
indexmap = "=2.11.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
strip = true
